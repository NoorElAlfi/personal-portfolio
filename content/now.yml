  description: 'JEV, a family of specialized "system one" decision-making models, and the current focus of hands-on experimentation: a Werewolf toy benchmark where a local LLM plays every character while Jev scores each statement for suspicion and votes out the most suspicious player each round, testing whether Jev catches werewolves more often than chance; plus applying Jev, with Semif as its open-source counterpart, to SIEM Guard.'
