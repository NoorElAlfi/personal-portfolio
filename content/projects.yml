  description: "Runs the same Werewolf and Mafia transcripts past Jev, TypeSafe's System One model, and past a set of baselines, and reports accuracy, calibration, cost and latency on both LLM-generated and human game data. Jev finds deception in LLM games (AUC 0.61-0.71) where its baselines do not; on the human sources the learned signal turns out to track a model's wolf style rather than deception itself."
