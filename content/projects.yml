- id: lucidhover
  title: LucidHover
  tag: VS Code Extension, Published
  description: A VS Code extension that hovers any function and explains it in the context of the whole repo (role, callers/callees, blast radius) via a fully local LLM through Ollama. Python sidecar parses with tree-sitter, builds a call graph, ranks functions by PageRank importance, and caches explanations in SQLite. Published to the VS Code Marketplace under Apache-2.0.
