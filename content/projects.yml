- id: siem-guard-code
  title: SIEM Guard
  tag: Security, LLM Pipelines, Anomaly Detection
  description: >-
    A local, LLM-assisted security-log pipeline: an Ollama model turns raw log lines into structured fields (validated replies, a template cache, and a regex baseline kept for comparison), while plain statistics decide what is anomalous — an Isolation Forest score gated by a robust median/MAD z-score for behavioral detection, plus weighted rules for supply-chain indicators in package installs. Everything runs on local hardware, so no log data leaves the machine. Published as a research prototype: code and tests only.
