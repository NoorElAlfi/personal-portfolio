- id: emu-cyber-ops-gym
  title: "EMU: Emulated Cyber Operations Gym"
  tag: M.Sc. Thesis
  description: Built a cyber attack/defense emulation gym for training reinforcement-learning-driven autonomous cyber agents, later migrated from VMware vSphere to Docker for faster environment setup; integrated Caldera, Velociraptor, Metasploit, and Nmap, with Blue/Red agent logic mapped to MITRE ATT&CK. Ran a 200-trial exploitation characterization experiment across 5 real CVE targets (Apache Druid, Apache Flink, HashiCorp Nomad, ProFTPD, Apache Struts2) and 4 attacker sophistication tiers, with 95%-CI success-rate benchmarking.
