- id: why-hire
  question: Why should we hire you?
  also_asked_as: ["strengths", "good candidate", "good fit", "fit for the role", "value you bring", "what you bring", "pitch", "sell yourself", "why you", "qualified", "qualifications", "what makes you", "why hire"]
  answer: >-
    I approach problems with safety and efficiency in mind, think them through thoroughly, and
    enjoy a challenge. I'm always trying to learn something new. I also measure my own work and say
    what the numbers show: my Elden Ring assistant passed 54 of 54 of its own checks and still
    failed most real questions, so I rebuilt the evaluation and took held-out retrieval from 4 of 20
    to 18 of 20; in SIEM Guard I dropped a model tier after measuring that it added no recall,
    which took fitting 50,000 entities from 1,551s to 0.8s. Safety shows up in how I build with
    agents: the CLI is read-only by default, previews before it writes, and logs every write. I'd
    bring that mix of agentic tooling, security background and evaluation discipline.

