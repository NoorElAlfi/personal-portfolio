- id: why-ai-security
  question: Why move from QA into AI and security engineering?
  also_asked_as: ["switch", "career change", "transition", "change careers", "moving away from qa", "quality assurance", "why leave qa", "why ai", "why security", "motivation", "passion"]
  answer: >-
    AI and security are where my expertise and my passion are. My QA automation work is already
    where AI agents meet real systems: at Miipe I built a CLI that lets an agent write and repair
    tests safely. I'm always trying to stay up to date and learn everything I can about both
    topics, and I do it by building and measuring: red-teaming frontier models at Scale AI,
    researching autonomous cyber agents for my M.Sc., and shipping local tools like LucidHover and
    SIEM Guard. I want to do this kind of work full time.
