# Hiring FAQ: shown on the home page and searchable through "Ask this site".
#
# Everything here is public (content/ is public-bundle material). Written by Noor; every figure
# repeats one already published elsewhere on the site, and `npm run verify` checks that.
# The question is the heading, so phrase it the way a recruiter would ask it.
# `also_asked_as` lists other ways to ask the same thing. It is used only to match a question to its
# entry (the search reads it); it is never shown on the page.

- id: about-you
  question: Tell me about yourself
  also_asked_as: ["introduce yourself", "introduction", "intro", "who are you", "background", "bio", "describe yourself", "overview", "about you", "summary of you"]
  answer: >-
    I'm a QA Automation Engineer at Miipe, promoted from QA Analyst in December 2025, and I'm
    finishing a research-based M.Sc. in AI and cybersecurity at Queen's University (thesis defense
    pending). My thesis work, EMU, is a cyber attack/defense emulation gym for training
    reinforcement-learning agents for autonomous cyber operations. I build agentic LLM tooling, at
    work and on my own, and report results with numbers: a test-authoring CLI an AI agent can
    drive, a security-log pipeline, a local Elden Ring assistant and a fine-tuned crossword model.
    Before Miipe I did adversarial red-teaming of frontier LLMs at Scale AI, and in 2023 I was a
    Security Technology Research Student at BlackBerry, where I built a testing framework for a
    deep-learning vulnerability detector (SySeVR).

- id: projects
  question: What projects have you worked on, and which is your best?
  also_asked_as: ["portfolio", "best work", "favourite project", "favorite project", "most impressive project", "highlights", "accomplishments", "achievements", "work samples"]
  answer: >-
    Six I'd lead with. At Miipe, the Test-Authoring CLI: 40+ test cases generated from YAML, and an
    agent-written 8-step test that passed in 40 seconds. SIEM Guard: rule-first log parsing at
    96,000-98,000 lines/s against roughly 1 on the LLM path. errag: held-out retrieval from 4 of 20
    to 18 of 20. Cryptic Coach: 3.6% on unseen clues, up from 1.0%. LucidHover: a VS Code extension
    that explains a function in the context of the whole repo using a fully local LLM, published on
    the VS Code Marketplace. EMU: my M.Sc. thesis, a cyber attack/defense emulation gym for
    training reinforcement-learning agents, with a 200-trial experiment across 5 real CVE targets.
    If I had to pick one, it's the CLI: it writes to a live platform behind a write gate and an
    audit log, and an AI agent can drive it safely.

