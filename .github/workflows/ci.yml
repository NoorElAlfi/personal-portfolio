name: CI

# Gate for pull requests only. The weekly agent run happens LOCALLY by design:
# it harvests activity from private repos, so that evidence must not transit CI
# logs or artifacts. CI verifies content integrity and that the site still builds.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
